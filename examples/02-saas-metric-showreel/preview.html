<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <style>
    
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0B0F19;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    .mf-scene {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
    .mf-clip {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
    }
    .mf-clip.mf-active {
      visibility: visible;
    }
    .mf-text-inner {
      white-space: pre-wrap;
      word-break: break-word;
    }
  
    #clip-QMliAPszQpmD {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 24px;
}

    #clip-nthhSmZK1IlU {
  font-family: 'Inter', sans-serif;
  font-size: 44px;
  font-weight: 800;
  font-style: normal;
  color: #F8FAFC;
  text-align: center;
  line-height: 1.2;
  letter-spacing: -0.5px;
}

    #clip-NXPa4w5IlQnX {
  font-family: 'Inter', sans-serif;
  font-size: 76px;
  font-weight: 900;
  font-style: normal;
  color: #6366F1;
  text-align: center;
  line-height: 1;
  letter-spacing: 2px;
  text-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
}

    #clip-P6wGux7HMjsU {
  font-family: 'Inter', sans-serif;
  font-size: 22px;
  font-weight: 500;
  font-style: normal;
  color: #94A3B8;
  text-align: center;
  line-height: 1.4;
  letter-spacing: 0.5px;
}

  </style>
</head>
<body>
  <div id="mf-scene" class="mf-scene">
    <div id="clip-QMliAPszQpmD" class="mf-clip mf-shape mf-shape-rectangle" style="z-index:1000;opacity:1;left:960px;top:540px;width:860px;height:480px;transform:translate(-50%, -50%);transform-origin:50% 50%" data-start="0.2" data-duration="5.6"></div>
    <div id="clip-nthhSmZK1IlU" class="mf-clip mf-text" style="z-index:999;opacity:1;left:960px;top:380px;transform:translate(-50%, -50%);transform-origin:50% 50%" data-start="0.6" data-duration="5.2">
      <span class="mf-text-inner">Supercharge Video Production</span>
    </div>
    <div id="clip-NXPa4w5IlQnX" class="mf-clip mf-text" style="z-index:998;opacity:1;left:960px;top:510px;transform:translate(-50%, -50%);transform-origin:50% 50%" data-start="1.2" data-duration="4.6">
      <span class="mf-text-inner">+480% RENDER SPEED</span>
    </div>
    <div id="clip-P6wGux7HMjsU" class="mf-clip mf-text" style="z-index:997;opacity:1;left:960px;top:630px;transform:translate(-50%, -50%);transform-origin:50% 50%" data-start="1.8" data-duration="4">
      <span class="mf-text-inner">Zero Timeline Bloat • Pure Deterministic Frame Pipelines</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    
(function() {
  'use strict';

  const TOTAL_DURATION = 6;
  const FPS = 60;

  // Master seekable timeline (paused — renderer controls playback)
  const master = gsap.timeline({ paused: true });

  // Update clip visibility based on current playback timestamp
  function updateVisibility(time) {
    const clips = document.querySelectorAll('.mf-clip');
    clips.forEach(el => {
      const start = parseFloat(el.dataset.start || '0');
      const duration = parseFloat(el.dataset.duration || '0');
      if (time >= start && time < (start + duration)) {
        el.style.visibility = 'visible';
      } else {
        el.style.visibility = 'hidden';
      }
    });
  }

  // Build clip animations
  master.set('#clip-QMliAPszQpmD', { scaleX: 0.85 }, 0.2);
  master.to('#clip-QMliAPszQpmD', { scaleX: 1, duration: 0.9, ease: 'power4.out' }, 0.2);
  master.set('#clip-QMliAPszQpmD', { scaleY: 0.85 }, 0.2);
  master.to('#clip-QMliAPszQpmD', { scaleY: 1, duration: 0.9, ease: 'power4.out' }, 0.2);
  master.set('#clip-QMliAPszQpmD', { opacity: 0 }, 0.2);
  master.to('#clip-QMliAPszQpmD', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.2);
  master.set('#clip-nthhSmZK1IlU', { y: 400 }, 0.6);
  master.to('#clip-nthhSmZK1IlU', { y: 380, duration: 0.8, ease: 'power2.out' }, 0.6);
  master.set('#clip-nthhSmZK1IlU', { opacity: 0 }, 0.6);
  master.to('#clip-nthhSmZK1IlU', { opacity: 1, duration: 0.6, ease: 'power2.out' }, 0.6);
  master.set('#clip-NXPa4w5IlQnX', { scaleX: 0.8 }, 1.2);
  master.to('#clip-NXPa4w5IlQnX', { scaleX: 1, duration: 0.8, ease: 'back.out(1.7)' }, 1.2);
  master.set('#clip-NXPa4w5IlQnX', { scaleY: 0.8 }, 1.2);
  master.to('#clip-NXPa4w5IlQnX', { scaleY: 1, duration: 0.8, ease: 'back.out(1.7)' }, 1.2);
  master.set('#clip-NXPa4w5IlQnX', { opacity: 0 }, 1.2);
  master.to('#clip-NXPa4w5IlQnX', { opacity: 1, duration: 0.4, ease: 'power2.out' }, 1.2);
  master.set('#clip-P6wGux7HMjsU', { opacity: 0 }, 1.8);
  master.to('#clip-P6wGux7HMjsU', { opacity: 1, duration: 0.7, ease: 'power2.out' }, 1.8);

  // Hook visibility update to timeline updates
  master.eventCallback('onUpdate', () => updateVisibility(master.time()));

  // Expose timeline for renderer control
  window.__mf_timeline = master;
  window.__mf_totalDuration = TOTAL_DURATION;
  window.__mf_fps = FPS;

  // Frame seek hook called by headless Chrome renderer
  window.__mf_seekToFrame = function(frame) {
    const time = frame / FPS;
    master.seek(time, false);
    updateVisibility(time);
  };

  // Initial state at frame 0
  window.__mf_seekToFrame(0);

  // Auto-play and loop in regular desktop browser preview
  if (typeof window !== 'undefined' && !navigator.userAgent.includes('Headless')) {
    master.repeat(-1);
    master.play();
  }

  // Signal ready
  window.__mf_ready = true;
})();

  </script>
</body>
</html>
