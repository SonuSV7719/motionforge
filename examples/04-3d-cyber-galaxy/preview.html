<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #0B132B 0%, #04060E 100%);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    .mf-scene {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
    .mf-clip {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
    }
    .mf-clip.mf-active {
      visibility: visible;
    }
    .mf-text-inner {
      white-space: pre-wrap;
      word-break: break-word;
    }
  
    #clip-QHOuKG9UElPa {
}

    #clip-BSIAA9NBeQLG {
  background: rgba(0, 240, 255, 0.12);
  border: 1.5px solid #00F0FF;
  border-radius: 50px;
}

    #clip-WDUdZwLIum84 {
  font-family: 'Orbitron', sans-serif;
  font-size: 14px;
  font-weight: 800;
  font-style: normal;
  color: #00F0FF;
  text-align: center;
  line-height: 1;
  letter-spacing: 3px;
}

    #clip-aSbRKH8gTkOd {
  font-family: 'Montserrat', sans-serif;
  font-size: 64px;
  font-weight: 900;
  font-style: normal;
  color: #FFFFFF;
  text-align: center;
  line-height: 1.05;
  letter-spacing: 4px;
  text-shadow: 0 4px 35px rgba(0, 240, 255, 0.45);
}

    #clip-9p2wsfmUDiaU {
  font-family: 'Inter', sans-serif;
  font-size: 20px;
  font-weight: 500;
  font-style: normal;
  color: #94A3B8;
  text-align: center;
  line-height: 1.4;
  letter-spacing: 1px;
}

    #clip-RqWkq2Zg24RQ {
  background: #00F0FF;
  border-radius: 2px;
}

  </style>
</head>
<body>
  <div id="mf-scene" class="mf-scene">
    <div id="clip-QHOuKG9UElPa" class="mf-clip mf-three3d" style="z-index:10;opacity:1;left:960px;top:540px;width:1920px;height:1080px;transform:translate(-50%, -50%);transform-origin:50% 50%" data-start="0" data-duration="6"></div>
    <div id="clip-BSIAA9NBeQLG" class="mf-clip mf-shape mf-shape-rectangle" style="z-index:11;opacity:1;left:960px;top:110px;width:360px;height:44px;transform:translate(-50%, -50%);transform-origin:50% 50%" data-start="0.3" data-duration="5.4"></div>
    <div id="clip-WDUdZwLIum84" class="mf-clip mf-text" style="z-index:12;opacity:1;left:960px;top:110px;transform:translate(-50%, -50%);transform-origin:50% 50%" data-start="0.4" data-duration="5.3">
      <span class="mf-text-inner">✦ REAL-TIME 3D WEBGL ENGINE</span>
    </div>
    <div id="clip-aSbRKH8gTkOd" class="mf-clip mf-text" style="z-index:13;opacity:1;left:960px;top:770px;transform:translate(-50%, -50%);transform-origin:50% 50%" data-start="0.8" data-duration="4.9">
      <span class="mf-text-inner">GENERATIVE 3D MOTION</span>
    </div>
    <div id="clip-9p2wsfmUDiaU" class="mf-clip mf-text" style="z-index:14;opacity:1;left:960px;top:855px;transform:translate(-50%, -50%);transform-origin:50% 50%" data-start="1.1" data-duration="4.6">
      <span class="mf-text-inner">Studio 3-Point Lighting • Physically Based Materials • 60 FPS Deterministic</span>
    </div>
    <div id="clip-RqWkq2Zg24RQ" class="mf-clip mf-shape mf-shape-rectangle" style="z-index:15;opacity:1;left:960px;top:915px;width:140px;height:3px;transform:translate(-50%, -50%);transform-origin:50% 50%" data-start="1.4" data-duration="4.3"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <script>
    
    (function() {
      const container = document.getElementById('clip-QHOuKG9UElPa');
      if (!container || typeof THREE === 'undefined') return;

      const width = container.clientWidth || 1920;
      const height = container.clientHeight || 1080;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
      camera.position.set(0, 0.2, 8.5);

      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(width, height);
      renderer.setPixelRatio(1);
      renderer.domElement.id = 'canvas-QHOuKG9UElPa';
      renderer.domElement.style.width = '100%';
      renderer.domElement.style.height = '100%';
      container.appendChild(renderer.domElement);

      // Studio 3-Point Lighting Rig with Neon Rim
      const ambientLight = new THREE.AmbientLight(0x101828, 1.2);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
      keyLight.position.set(6, 8, 5);
      scene.add(keyLight);

      const rimLight = new THREE.PointLight('#00F0FF', 4.0, 50);
      rimLight.position.set(-6, -4, 3);
      scene.add(rimLight);

      const fillLight = new THREE.DirectionalLight(0x7000FF, 1.8);
      fillLight.position.set(0, -6, -2);
      scene.add(fillLight);

      let meshObject = null;
      let particleSystem = null;

      
          // 1. Refined Torus Knot Geometry (Fitting cleanly in frame)
          const geometry = new THREE.TorusKnotGeometry(0.72, 0.22, 160, 36, 2, 3);
          const material = new THREE.MeshStandardMaterial({
            color: '#00F0FF',
            wireframe: false,
            metalness: 0.9,
            roughness: 0.15,
            emissive: '#00F0FF',
            emissiveIntensity: 0.25,
          });
          meshObject = new THREE.Mesh(geometry, material);
          meshObject.position.set(0, 0.45, 0);

          // 2. Add Background Ambient Particle Field
          const pGeo = new THREE.BufferGeometry();
          const pPos = [];
          const pColors = [];
          const c1 = new THREE.Color('#00F0FF');
          const c2 = new THREE.Color('#7000FF');
          for (let i = 0; i < 900; i++) {
            const r = 2.0 + Math.random() * 4.0;
            const t = Math.random() * Math.PI * 2;
            const p = (Math.random() - 0.5) * Math.PI * 2;
            pPos.push(r * Math.cos(t), r * Math.sin(t) * 0.5, r * Math.sin(p));
            const c = c1.clone().lerp(c2, Math.random());
            pColors.push(c.r, c.g, c.b);
          }
          pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
          pGeo.setAttribute('color', new THREE.Float32BufferAttribute(pColors, 3));
          particleSystem = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.035, vertexColors: true, transparent: true, opacity: 0.7 }));
        

      if (meshObject) scene.add(meshObject);
      if (particleSystem) scene.add(particleSystem);

      // Register render hook with MotionForge frame-seek pipeline
      if (!window.__mf_three_renders) window.__mf_three_renders = [];
      window.__mf_three_renders.push(function(time) {
        if (meshObject) {
          meshObject.rotation.x = time * 0.4;
          meshObject.rotation.y = time * 0.65;
          meshObject.rotation.z = Math.sin(time * 0.5) * 0.1;
          meshObject.position.y = 0.45 + Math.sin(time * 1.5) * 0.08;
        }
        if (particleSystem) {
          particleSystem.rotation.y = time * 0.1;
          particleSystem.rotation.x = Math.sin(time * 0.2) * 0.06;
        }
        renderer.render(scene, camera);
      });

      // Render initial frame
      renderer.render(scene, camera);
    })();
    
    
    
(function() {
  'use strict';

  const TOTAL_DURATION = 6;
  const FPS = 60;

  // Master seekable timeline (paused — renderer controls playback)
  const master = gsap.timeline({ paused: true });

  // Update clip visibility and trigger 3D WebGL renders
  function updateVisibility(time) {
    const clips = document.querySelectorAll('.mf-clip');
    clips.forEach(el => {
      const start = parseFloat(el.dataset.start || '0');
      const duration = parseFloat(el.dataset.duration || '0');
      if (time >= start && time < (start + duration)) {
        el.style.visibility = 'visible';
      } else {
        el.style.visibility = 'hidden';
      }
    });

    if (window.__mf_three_renders && Array.isArray(window.__mf_three_renders)) {
      for (let j = 0; j < window.__mf_three_renders.length; j++) {
        try { window.__mf_three_renders[j](time); } catch(e) {}
      }
    }
  }

  // Build clip animations
  master.fromTo('#clip-QHOuKG9UElPa', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, 0);
  master.set('#clip-BSIAA9NBeQLG', { scaleX: 0 }, 0.3);
  master.to('#clip-BSIAA9NBeQLG', { scaleX: 1, duration: 0.5, ease: 'back.out(1.7)' }, 0.3);
  master.set('#clip-BSIAA9NBeQLG', { scaleY: 0 }, 0.3);
  master.to('#clip-BSIAA9NBeQLG', { scaleY: 1, duration: 0.5, ease: 'back.out(1.7)' }, 0.3);
  master.set('#clip-WDUdZwLIum84', { opacity: 0 }, 0.4);
  master.to('#clip-WDUdZwLIum84', { opacity: 1, duration: 0.3, ease: 'power2.out' }, 0.4);
  master.set('#clip-aSbRKH8gTkOd', { y: 820 }, 0.8);
  master.to('#clip-aSbRKH8gTkOd', { y: 770, duration: 0.7, ease: 'power4.out' }, 0.8);
  master.set('#clip-aSbRKH8gTkOd', { opacity: 0 }, 0.8);
  master.to('#clip-aSbRKH8gTkOd', { opacity: 1, duration: 0.4, ease: 'power2.out' }, 0.8);
  master.set('#clip-9p2wsfmUDiaU', { y: 880 }, 1.1);
  master.to('#clip-9p2wsfmUDiaU', { y: 855, duration: 0.5, ease: 'power2.out' }, 1.1);
  master.set('#clip-9p2wsfmUDiaU', { opacity: 0 }, 1.1);
  master.to('#clip-9p2wsfmUDiaU', { opacity: 1, duration: 0.4, ease: 'power2.out' }, 1.1);
  master.set('#clip-RqWkq2Zg24RQ', { scaleX: 0 }, 1.4);
  master.to('#clip-RqWkq2Zg24RQ', { scaleX: 1, duration: 0.6, ease: 'power4.out' }, 1.4);

  // Hook visibility update to timeline updates
  master.eventCallback('onUpdate', () => updateVisibility(master.time()));

  // Expose timeline for renderer control
  window.__mf_timeline = master;
  window.__mf_totalDuration = TOTAL_DURATION;
  window.__mf_fps = FPS;

  // Frame seek hook called by headless Chrome renderer
  window.__mf_seekToFrame = function(frame) {
    const time = frame / FPS;
    master.seek(time, false);
    updateVisibility(time);
  };

  // Initial state at frame 0
  window.__mf_seekToFrame(0);

  // Auto-play and loop in regular desktop browser preview
  if (typeof window !== 'undefined' && !navigator.userAgent.includes('Headless')) {
    master.repeat(-1);
    master.play();
  }

  // Signal ready
  window.__mf_ready = true;
})();

  </script>
</body>
</html>
